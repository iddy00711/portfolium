<script>
  const div_arr = [
    "X-Ray Image Analysis AI project",
    "Road works API",
    "ML Cafe Customer Prediction",
    "Binaric Static Generator",
    "Chef Robotiks"
  ];

  const div_link = [
    "https://github.com/idrisdodwell00711/CNN-Xrays",
    "https://road-works-byley.onrender.com",
    "https://github.com/idrisdodwell00711/ML_project",
    "https://github.com/idrisdodwell00711/ad_mech_binary",
    "https://www.instagram.com/chefrobotiks?igsh=MWpiMTVxYzd2YjVpeA=="


  ]

  for(let i=0; i<div_arr.length;i++){
    let div = document.createElement('div');

    div.className = 'project-card';
    div.innerHTML = `${div_arr[i]}`;
    div.style.top = `${20 + i*15}vh`;
    div.style.left = '30vw';
    div.onclick = ()=>{
      window.location.replace(`${div_link[i]}`);
    }
    div.style.position = 'absolute';
    div.style.padding = '20px';
    div.style.fontSize = '44px';    
    div.style.color = 'rgb(10, 200, 200)';
    //div.style.background = 'white';
    div.style.opacity = '0.99';
    div.style.zIndex = '10';
    document.body.appendChild(div);
  }
</script>
<script src='index.js'></script>
